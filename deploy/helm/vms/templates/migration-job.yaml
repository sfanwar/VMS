{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: vms-migrate-{{ .Release.Revision }}
  annotations:
    # post-install: on a first install the embedded Postgres only exists once the
    #   main resources are created, so the migration must run *after* install
    #   (a pre-install hook would have no database to connect to).
    # pre-upgrade: on later upgrades the database already exists, so run the
    #   migration before the new app pods roll out.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: vms-migrate
    spec:
      restartPolicy: Never
      {{- if .Values.postgres.enabled }}
      # Wait until the in-cluster Postgres is accepting connections before
      # running migrations (covers the StatefulSet/PVC start-up delay).
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres:5432..."; sleep 2;
              done
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.migrations.image }}
          command:
            - /bin/sh
            - -c
            - |
              cd /app && npx typeorm migration:run -d infrastructure/migrations/data-source.js
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vms-secrets, key: DATABASE_URL } }
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
