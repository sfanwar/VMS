{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: vms-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: vms-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.migrations.image }}
          command:
            - /bin/sh
            - -c
            - |
              cd /app && npx typeorm migration:run -d infrastructure/migrations/data-source.js
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vms-secrets, key: DATABASE_URL } }
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
