{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    app: {{ .Values.frontend.name }}
    tier: frontend
spec:
  ports:
    # Service is exposed on .Values.frontend.port (80, used by the ingress) and
    # forwards to the container's actual listen port. The frontend image serves
    # the built app with `vite preview` on 5173, so targetPort must match that.
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.targetPort | default 5173 }}
      name: http
  selector:
    app: {{ .Values.frontend.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    app: {{ .Values.frontend.name }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
        tier: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "vms.frontendImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: {{ .Values.frontend.targetPort | default 5173 }}, name: http }]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.targetPort | default 5173 }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.targetPort | default 5173 }} }
            initialDelaySeconds: 15
            periodSeconds: 15
{{- end }}
