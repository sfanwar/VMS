{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-gateway }
spec:
  podSelector: { matchLabels: { app: {{ .Values.services.gateway.name }} } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: {{ .Values.services.gateway.port }} }]
---
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-frontend }
spec:
  podSelector: { matchLabels: { app: {{ .Values.frontend.name }} } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: 80 }]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-backend-mesh }
spec:
  podSelector: { matchLabels: { tier: backend } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { tier: backend } } }]
  egress:
    - to: [{ podSelector: { matchLabels: { tier: backend } } }]
    {{- if .Values.postgres.enabled }}
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    {{- end }}
    {{- if .Values.minio.enabled }}
    - to: [{ podSelector: { matchLabels: { app: minio } } }]
      ports: [{ protocol: TCP, port: 9000 }]
    {{- end }}
    {{- if .Values.mailhog.enabled }}
    - to: [{ podSelector: { matchLabels: { app: mailhog } } }]
      ports: [{ protocol: TCP, port: 1025 }]
    {{- end }}
{{- end }}
