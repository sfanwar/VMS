# ─────────────────────────────────────────────────────────
# MinIO — Object storage for document blobs
# ─────────────────────────────────────────────────────────
# Production note: prefer AWS S3 / Azure Blob / GCS via the same
# S3-compatible client interface. Point MINIO_ENDPOINT at the
# managed service and remove this manifest.

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: vms
  labels: { app: minio }
spec:
  ports:
    - { name: api,     port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
  selector: { app: minio }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: vms
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: vms-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: vms-secrets, key: MINIO_ROOT_PASSWORD } } }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
