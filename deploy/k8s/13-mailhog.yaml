# ─────────────────────────────────────────────────────────
# MailHog — Dev/staging SMTP sink
# ─────────────────────────────────────────────────────────
# DO NOT apply to production. In prod, the notification-service
# uses a real SMTP relay (SES, SendGrid, internal MTA). The
# helm chart toggles this off via values.yaml.

apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: vms
  labels: { app: mailhog }
spec:
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: web,  port: 8025, targetPort: 8025 }
  selector: { app: mailhog }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: vms
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailhog }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:latest
          ports:
            - { containerPort: 1025, name: smtp }
            - { containerPort: 8025, name: web }
          resources:
            requests: { cpu: "10m",  memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
