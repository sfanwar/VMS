# Frontend — static React build behind nginx
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vms
  labels: { app: frontend, tier: frontend }
spec:
  ports: [{ port: 80, targetPort: 80, name: http }]
  selector: { app: frontend }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vms
  labels: { app: frontend, tier: frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: frontend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ghcr.io/REPLACE-OWNER/vms-frontend:latest
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: "10m",  memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 15
