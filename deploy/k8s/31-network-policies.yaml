# ─────────────────────────────────────────────────────────
# NetworkPolicies — default-deny + service whitelist
# ─────────────────────────────────────────────────────────
# Defense in depth: only the gateway should be reachable from
# outside the namespace; backends only accept traffic from
# sibling services + the gateway.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vms
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vms
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Gateway is the only thing the ingress controller can hit
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: vms
spec:
  podSelector:
    matchLabels: { app: api-gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 3000 }]
---
# Frontend reachable from ingress controller too
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: vms
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 80 }]
---
# Backend services only accept traffic from sibling services in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-mesh
  namespace: vms
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: backend }
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: backend }
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - podSelector:
            matchLabels: { app: redis }
      ports: [{ protocol: TCP, port: 6379 }]
    - to:
        - podSelector:
            matchLabels: { app: minio }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - podSelector:
            matchLabels: { app: mailhog }
      ports: [{ protocol: TCP, port: 1025 }]
