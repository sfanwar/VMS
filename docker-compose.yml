# Visa Management System — full local stack
# Usage: docker-compose up -d --build

services:

  # ─────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: vms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-visa_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visa_admin} -d ${POSTGRES_DB:-visa_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vms-net

  redis:
    image: redis:7-alpine
    container_name: vms-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vms-net

  minio:
    image: minio/minio:latest
    container_name: vms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vms-net

  # Creates the documents bucket on first start
  minio-init:
    image: minio/mc:latest
    container_name: vms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/visa-documents;
      mc anonymous set none local/visa-documents;
      echo 'MinIO bucket initialized';
      "
    networks:
      - vms-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: vms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - vms-net

  # ─────────────────────────────────────────────────────────────
  # Microservices
  # ─────────────────────────────────────────────────────────────

  auth-service:
    build: ./services/auth-service
    container_name: vms-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      USER_SERVICE_URL: http://user-service:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "3001:3001"
    networks:
      - vms-net

  user-service:
    build: ./services/user-service
    container_name: vms-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: users
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "3002:3002"
    networks:
      - vms-net

  request-service:
    build: ./services/request-service
    container_name: vms-request-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: requests
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      WORKFLOW_SERVICE_URL: http://workflow-service:3004
      USER_SERVICE_URL: http://user-service:3002
    ports:
      - "3003:3003"
    networks:
      - vms-net

  workflow-service:
    build: ./services/workflow-service
    container_name: vms-workflow-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: workflow
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    ports:
      - "3004:3004"
    networks:
      - vms-net

  document-service:
    build: ./services/document-service
    container_name: vms-document-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: documents
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: visa-documents
      MINIO_USE_SSL: "false"
    ports:
      - "3005:3005"
    networks:
      - vms-net

  notification-service:
    build: ./services/notification-service
    container_name: vms-notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      DATABASE_SCHEMA: notifications
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@visa-management.local
    ports:
      - "3006:3006"
    networks:
      - vms-net

  api-gateway:
    build: ./services/api-gateway
    container_name: vms-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - request-service
      - workflow-service
      - document-service
      - notification-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      REQUEST_SERVICE_URL: http://request-service:3003
      WORKFLOW_SERVICE_URL: http://workflow-service:3004
      DOCUMENT_SERVICE_URL: http://document-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      REPORTING_SERVICE_URL: http://reporting-service:3007
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    networks:
      - vms-net

  reporting-service:
    build: ./services/reporting-service
    container_name: vms-reporting-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3007
      DATABASE_URL: postgres://${POSTGRES_USER:-visa_admin}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-visa_management}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string}
    ports:
      - "3007:3007"
    networks:
      - vms-net

  # ─────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    container_name: vms-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3000}
    ports:
      - "5173:5173"
    networks:
      - vms-net

networks:
  vms-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
