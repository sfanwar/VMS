name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the images (defaults to commit SHA)'
        required: false
      deploy:
        description: 'Deploy to AKS after building (tag pushes always deploy)'
        type: boolean
        default: false
        required: false

env:
  REGISTRY: ghcr.io

# Default token scopes for all jobs (each job narrows these as needed).
# `packages: write` is required to push images to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./services/auth-service
          - service: user-service
            context: ./services/user-service
          - service: request-service
            context: ./services/request-service
          - service: workflow-service
            context: ./services/workflow-service
          - service: document-service
            context: ./services/document-service
          - service: notification-service
            context: ./services/notification-service
          - service: api-gateway
            context: ./services/api-gateway
          - service: reporting-service
            context: ./services/reporting-service
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR requires the image path to be lowercase; lowercase the owner defensively.
      - name: Compute lowercase image prefix
        id: img
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/vms" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ steps.img.outputs.prefix }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

  scan-images:
    name: Scan ${{ matrix.service }} for CVEs
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read              # needed to pull private image from GHCR
      security-events: write      # needed to upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, user-service, request-service, workflow-service, document-service, notification-service, api-gateway, frontend]
    steps:
      - name: Compute lowercase image prefix
        id: img
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/vms" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image locally so Trivy can scan it
        run: |
          docker pull ${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}

      - name: Trivy image scan (human-readable table in workflow log)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Trivy SARIF (best effort)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.prefix }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload SARIF to GitHub Code Scanning (best effort)
        # Skipped automatically if SARIF wasn't produced or Code Scanning isn't enabled on this repo
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ──────────────────────────────────────────────────────
  # Deploy the freshly-built images to AKS via Helm.
  #
  # Runs only for tag pushes (real releases) or a workflow_dispatch
  # with deploy=true. Gated behind the `production` GitHub Environment
  # so its secrets/vars are scoped and any required approvals apply.
  #
  # Authentication uses Azure OIDC (workload identity federation) — no
  # long-lived service-principal secret is stored in the repo. Configure
  # a federated credential on the app registration that trusts this repo's
  # `production` environment. Required Environment secrets:
  #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
  #   AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME
  #   VMS_JWT_SECRET, VMS_INTERNAL_API_KEY, VMS_POSTGRES_PASSWORD,
  #   VMS_REDIS_PASSWORD, VMS_MINIO_ROOT_USER, VMS_MINIO_ROOT_PASSWORD
  # Required Environment variable:
  #   AKS_INGRESS_HOST   (e.g. vms.fad.gov.ae)
  # ──────────────────────────────────────────────────────
  deploy-aks:
    name: Deploy to AKS
    needs: [build-and-push, scan-images]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy
    environment:
      name: production
      url: https://${{ vars.AKS_INGRESS_HOST }}
    permissions:
      contents: read
      id-token: write          # required for Azure OIDC federated login
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image repository
        id: img
        run: echo "repo=${GITHUB_REPOSITORY_OWNER,,}/vms" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (fetch kubeconfig)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Ensure namespace exists
        run: kubectl create namespace vms --dry-run=client -o yaml | kubectl apply -f -

      - name: Create / refresh GHCR image pull secret
        run: |
          kubectl -n vms create secret docker-registry ghcr-pull \
            --docker-server="${REGISTRY}" \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Attach the pull secret to the namespace's default ServiceAccount so the
          # pre-upgrade migration Job (which has no imagePullSecrets of its own) can
          # pull private GHCR images too.
          kubectl -n vms patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Helm upgrade --install
        run: |
          helm upgrade --install vms deploy/helm/vms \
            --namespace vms \
            -f deploy/helm/vms/values-aks.yaml \
            --set global.imageRegistry="${REGISTRY}" \
            --set global.imageRepository="${{ steps.img.outputs.repo }}" \
            --set global.imageTag="${{ steps.tag.outputs.tag }}" \
            --set global.imagePullSecrets[0].name=ghcr-pull \
            --set migrations.image="${REGISTRY}/${{ steps.img.outputs.repo }}-auth-service:${{ steps.tag.outputs.tag }}" \
            --set ingress.host="${{ vars.AKS_INGRESS_HOST }}" \
            --set-string secrets.jwtSecret="${{ secrets.VMS_JWT_SECRET }}" \
            --set-string secrets.internalApiKey="${{ secrets.VMS_INTERNAL_API_KEY }}" \
            --set-string secrets.postgresPassword="${{ secrets.VMS_POSTGRES_PASSWORD }}" \
            --set-string secrets.redisPassword="${{ secrets.VMS_REDIS_PASSWORD }}" \
            --set-string secrets.minioRootUser="${{ secrets.VMS_MINIO_ROOT_USER }}" \
            --set-string secrets.minioRootPassword="${{ secrets.VMS_MINIO_ROOT_PASSWORD }}" \
            --wait --timeout 10m --atomic

      - name: Verify rollout
        run: |
          echo "Deployed tag: ${{ steps.tag.outputs.tag }}"
          kubectl -n vms rollout status deploy/api-gateway --timeout=300s
          kubectl -n vms get pods -o wide

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n vms get all || true
          kubectl -n vms get events --sort-by=.lastTimestamp | tail -40 || true
